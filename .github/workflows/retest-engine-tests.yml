name: Retest engine tests
on:
  pull_request:
  push:
    branches: [main, upgrade/retest-engine-data-watchdog]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run deterministic strategy tests
        run: node --test tests/retest-engine.test.cjs
